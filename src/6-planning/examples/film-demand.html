<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<title>Film Catalog Demand Overview</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5/dist/css/bootstrap.min.css" rel="stylesheet" />
	<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
	<style>
		.dashboard-container {
			max-width: 1480px;
		}
		.dashboard-element, .dashboard-element > .card, .dashboard-element .card-body {
			min-width: 0;
		}
		.dashboard-element {
			display: flex;
			align-items: stretch;
			flex-direction: column;
		}
		.dashboard-element > * {
			flex: 1 1 auto;
			min-width: 0;
			width: 100%;
			height: 100%;
		}
		.dashboard-element .card > :not(.card-body) {
			margin: 0 var(--bs-card-spacer-x) var(--bs-card-spacer-y);
		}
		.dashboard-element-table .card-body {
			display: flex;
			flex-direction: column;
		}
		.dashboard-element-table .table-responsive {
			max-height: 360px;
			overflow: auto;
		}
		.dashboard-element-metric .metric-value-number {
			display: block;
			margin-top: 0.75rem;
			font-size: 2.5rem !important;
			font-weight: 700 !important;
			line-height: 1.1;
		}
		.dashboard-element-header + .dashboard-element-metric .metric-value-number {
			font-size: 3rem !important;
		}
		.dashboard-element-metric [id$="-label"] {
			margin-top: 0.25rem;
			color: var(--bs-secondary-color);
			font-size: 0.875rem;
		}
	</style>
</head>

<body>
	<div class="container dashboard-container my-4">
		<div class="row g-3">

			<div id="header-dashboard-header" class="col-12 dashboard-element dashboard-element-header">

				<template data-dashboard-element-template="header-dashboard-header">
<div class="mb-3"><h2 class="h4 mb-1">Film Catalog Demand Overview</h2><p class="text-muted mb-0">Use the metrics below to quickly compare which catalog attributes are most associated with demand and inventory availability.</p></div>
				</template>

			</div>

			<div id="metric-top-category" class="col-12 col-md-6 dashboard-element dashboard-element-metric">

				<template data-dashboard-element-template="metric-top-category">
<div class="card h-100"><div class="card-body"><div><h6 class="card-title fw-semibold mb-1">Top Category by Films</h6><div id="metric-top-category-label" class="text-muted small">&nbsp;</div><div id="metric-top-category-value" class="metric-value-number">&nbsp;</div></div></div></div>
				</template>

			</div>

			<div id="metric-top-rating" class="col-12 col-md-6 dashboard-element dashboard-element-metric">

				<template data-dashboard-element-template="metric-top-rating">
<div class="card h-100"><div class="card-body"><h6 class="card-title fw-semibold mb-1">Most Common Rating</h6><div class="text-muted small mb-2">The rating appearing most often across the film catalog.</div><div class="d-flex flex-column"><div class="text-muted small" id="metric-top-rating-label">PG-13</div><div class="metric-value-number" id="metric-top-rating-value">223</div></div></div></div>
				</template>

			</div>

			<div id="metric-avg-rental-duration" class="col-12 col-md-4 dashboard-element dashboard-element-metric">

				<template data-dashboard-element-template="metric-avg-rental-duration">
<div class="card h-100"><div class="card-body"><div><h6 class="card-title fw-semibold mb-1">Average Rental Duration</h6><div class="text-muted small mb-2">The overall average rental duration across all films.</div><div class="d-flex align-items-baseline gap-2"><div id="metric-avg-rental-duration-value" class="metric-value-number">—</div><div id="metric-avg-rental-duration-label" class="text-muted small"> </div></div></div></div></div>
				</template>

			</div>

			<div id="metric-avg-replacement-cost" class="col-12 col-md-4 dashboard-element dashboard-element-metric">

				<template data-dashboard-element-template="metric-avg-replacement-cost">
<div class="card h-100"><div class="card-body"><div class="mb-2"><h6 class="card-title fw-semibold mb-1">Average Replacement Cost</h6><div class="text-muted small">The overall average replacement cost across all films.</div></div><div id="metric-avg-replacement-cost-label" class="text-muted small"></div><div id="metric-avg-replacement-cost-value" class="metric-value-number">—</div></div></div>
				</template>

			</div>

			<div id="metric-inventory-count" class="col-12 col-md-4 dashboard-element dashboard-element-metric">

				<template data-dashboard-element-template="metric-inventory-count">
<div class="card h-100"><div class="card-body"><h6 class="card-title fw-semibold mb-1">Total Inventory Copies</h6><div id="metric-inventory-count-label" class="text-muted small mb-2"></div><div id="metric-inventory-count-value" class="metric-value-number fw-bold">—</div><div class="small text-muted mt-2">The total number of inventory records available across all stores.</div></div></div>
				</template>

			</div>

			<div id="chart-category-demand" class="col-12 dashboard-element dashboard-element-chart">

<div class="card h-100"><div class="card-body"><div><h6 class="card-title fw-semibold mb-1">Film Demand by Category</h6><div class="text-muted small">Ranked view of demand across film categories, showing which categories attract the most rentals and payments.</div></div><div style="position: relative; height: 420px; width: 100%;"><canvas id="chart-category-demand-canvas"></canvas></div></div></div>
				</template>

			</div>

				</template>

			</div>

				</template>

			<div id="table-store-inventory" class="col-12 col-md-6 dashboard-element dashboard-element-table">

<div class="card h-100">

        <h6 class="card-title fw-semibold mb-1">Top Demand Films</h6>

    </div>

    </div>
  </div>
</div>

			<div id="insight-cat-demand" class="col-12 col-md-6 dashboard-element dashboard-element-insight">

				<template data-dashboard-element-template="insight-cat-demand">
<div class="card h-100"><div class="card-body"><div class="mb-2"><div class="d-flex flex-wrap align-items-start justify-content-between gap-2"><div><h5 class="card-title fw-semibold mb-1">Demand by category</h5><div class="text-muted small">Identify which film categories attract the most rentals and payment volume.</div></div></div></div><ul><li><strong>Sports</strong> leads by demand, with <strong>1,179 rentals</strong> and the highest payment total at <strong>$5,314.21</strong>.</li><li><strong>Animation</strong> and <strong>Action</strong> also show strong rental volume, at <strong>1,166</strong> and <strong>1,112</strong> rentals respectively, though both generate less payment than Sports.</li><li><strong>Sci-Fi</strong> stands out for revenue efficiency: it ranks fourth in rentals (<strong>1,101</strong>) but has a relatively high average payment per rental of <strong>$4.32</strong>, above several higher-volume categories.</li><li><strong>Comedy</strong> and <strong>New</strong> have some of the highest average payment per rental in the excerpt, at <strong>$4.66</strong> and <strong>$4.63</strong>, despite only mid-pack rental counts (~<strong>940</strong> rentals each).</li><li>Lower-demand categories in this excerpt include <strong>Horror</strong> (<strong>846</strong> rentals) and <strong>Music</strong> (<strong>830</strong> rentals), with total payments of <strong>$3,722.54</strong> and <strong>$3,417.72</strong> respectively.</li></ul></div></div>
				</template>

			</div>

			<div id="insight-film-patterns" class="col-12 col-md-6 dashboard-element dashboard-element-insight">

				<template data-dashboard-element-template="insight-film-patterns">
<div class="card h-100"><div class="card-body"><h6 class="mb-1">Demand patterns by film attributes</h6><p class="text-muted small">Compare rental activity across rating, rental duration, replacement cost, and actor participation.</p><ul><li><strong>PG-13 and PG titles show the strongest rental volume</strong> in the excerpt, led by <span>PG-13 / 6 days / gte_25</span> with <span>359 rentals</span> and <span>PG / 4 days / 20_to_lt_25</span> with <span>305 rentals</span>.</li><li><strong>Shorter rental durations often pair with higher average payments</strong>: for example, <span>G / 3 days / gte_25</span> averages <span>5.38</span>, and <span>NC-17 / 3 days / 20_to_lt_25</span> averages the highest seen here at <span>5.67</span>.</li><li><strong>Lower replacement-cost bands tend to have lower average payments</strong> in several visible rows, especially <span>lt_15</span> entries such as <span>PG / 6 days</span> at <span>2.88</span> and <span>NC-17 / 6 days / gte_25</span> at <span>2.97</span>.</li><li><strong>Actor presence is uniformly “has_actor”</strong> in the excerpt, so there is no visible contrast yet between actor and non-actor titles; a fuller result would be needed to assess actor participation effects.</li><li><strong>Overall, demand appears concentrated in a few rating-duration combinations</strong>, with <span>PG, PG-13, R, and NC-17</span> all posting rental counts in the low-to-mid 200s or higher across the visible bands.</li></ul></div></div>
				</template>

			</div>

<div class="p-3">
  <div class="mb-3">
    <h4 class="h5 mb-1">How to read this section</h4>
    <div class="text-muted" style="white-space: normal;">This section focuses on catalog demand signals from rentals and payments, with inventory used to contextualize availability across stores.</div>
  </div>
  <div class="text-muted" style="line-height: 1.5;">
    <ul class="mb-0 ps-3">
      <li><strong>Demand signals:</strong> Look for patterns in rentals and payments to understand which catalog items are attracting usage.</li>
      <li><strong>Inventory context:</strong> Use inventory levels to interpret whether demand is likely constrained by availability or supported by stock.</li>
      <li><strong>Cross-store comparison:</strong> When values differ by store, treat inventory as a key lens for explaining why the same title/category may perform differently.</li>
      <li><strong>Use these sections together:</strong> High demand with limited inventory may indicate an opportunity to rebalance or restock.</li>
    </ul>
  </div>
</div>
				</template>

			</div>

		</div>

document.addEventListener('DOMContentLoaded', () => {
	for (const template of document.querySelectorAll('template[data-dashboard-element-template]')) {
		const target = document.getElementById(template.dataset.dashboardElementTemplate);

			target.replaceChildren(template.content.cloneNode(true));
		}
	}

	const getData = (key) => window.dashboardData?.[key] ?? [];
	const firstRow = (key) => {
		const rows = getData(key);
		return Array.isArray(rows) ? rows[0] : rows;
	};
	const formatNumber = (value, maximumFractionDigits = 0) => {
		const number = Number(value);
		return Number.isFinite(number) ? new Intl.NumberFormat(undefined, { maximumFractionDigits }).format(number) : '-';
	};
	const formatCurrency = (value, currency = 'USD') => {
		const number = Number(value);
		return Number.isFinite(number) ? new Intl.NumberFormat(undefined, { style: 'currency', currency }).format(number) : '-';
	};
	const formatPercent = (value, maximumFractionDigits = 1) => {
		const number = Number(value);
		return Number.isFinite(number) ? formatNumber(number, maximumFractionDigits) + '%' : '-';
	};
	const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, char => ({
		'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
	}[char]));

			script: "const row = firstRow('metric-avg-rental-duration');\nconst valueEl = document.getElementById('metric-avg-rental-duration-value');\nconst labelEl = document.getElementById('metric-avg-rental-duration-label');\nif (row && valueEl) {\n  const value = row.average_rental_duration;\n  valueEl.textContent = (value === null || value === undefined) ? '—' : formatNumber(value, 2);\n  if (labelEl) {\n    labelEl.textContent = 'days';\n  }\n}",

          }\n          },\n          x2: {\n            beginAtZero: true,\n            grid: {\n              drawOnChartArea: false\n            },\n            position: 'top',\n            title: {\n              display: true,\n              text: 'Payments'\n            }\n          }\n        }\n      }\n    });\n  }\n}",

xt.dataset.type === \"scatter\") {\n              const raw = context.raw || {};\n              const xVal = raw.x;\n              const yVal = raw.y;\n              return datasetLabel + \": Rentals=\" + formatNumber(xVal, 0) + \", Replacement Cost=\" + formatCurrency(yVal);\n            }\n            return datasetLabel + \": \" + formatNumber(context.raw?.y ?? 0, 0);\n          }\n        }\n      }\n    },\n    scales: {\n      x: {\n        type: \"linear\",\n        position: \"bottom\",\n        title: {\n          display: true,\n          text: \"Total Rentals (demand)\"\n        },\n        grid: {\n          drawOnChartArea: true\n        }\n      },\n      y: {\n        title: {\n          display: true,\n          text: \"Replacement Cost\"\n        },\n        ticks: {\n          callback: function(value) {\n            return formatCurrency(value);\n          }\n        }\n      },\n      x2: {\n        type: \"category\",\n        position: \"top\",\n        grid: {\n          display: false,\n          drawOnChartArea: false\n        },\n        ticks: {\n          maxRotation: 0,\n          autoSkip: true\n        }\n      },\n      y2: {\n        position: \"right\",\n        grid: {\n          drawOnChartArea: false\n        },\n        title: {\n          display: true,\n          text: \"Actor Rental Count\"\n        }\n      }\n    }\n  }\n});",
