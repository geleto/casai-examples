		.dashboard-element, .dashboard-element > .card, .dashboard-element .card-body {
			min-width: 0;
		}
		.dashboard-element {
			display: flex;
			align-items: stretch;
			flex-direction: column;
		}
		.dashboard-element > * {
			flex: 1 1 auto;
			min-width: 0;
			width: 100%;
			height: 100%;
		}
		.dashboard-element .card > :not(.card-body) {
			margin: 0 var(--bs-card-spacer-x) var(--bs-card-spacer-y);
		}
		.dashboard-element-table .card-body {
			display: flex;
			flex-direction: column;
		}
		.dashboard-element-table .table-responsive {
			max-height: 360px;
			overflow: auto;
		}
		.dashboard-element-kpi .kpi-value-number {
			display: block;
			margin-top: 0.75rem;
			font-size: 2.5rem !important;
			font-weight: 700 !important;
			line-height: 1.1;
		}
		.dashboard-element-header + .dashboard-element-kpi .kpi-value-number {
			font-size: 3rem !important;
		}
		.dashboard-element-kpi [id$="-label"] {
			margin-top: 0.25rem;
			color: var(--bs-secondary-color);
			font-size: 0.875rem;
		}
	</style>
</head>

			<div id="insight-insight-genre-performance" class="col-12 col-md-6 dashboard-element dashboard-element-insight">

<div class="card h-100"><div class="card-body"><h6 class="card-title fw-semibold mb-1">Genre Performance &amp; Revenue Distribution</h6><div class="text-muted small mb-3">Rankings of genres by sales volume and revenue to identify top-performing categories and guide promotional investment decisions</div><ul>
  <li><strong>Rock dominates catalog performance</strong>, generating $826.65 in revenue across 835 units sold—significantly outpacing the second-place Latin genre at $382.14, representing over 2x the revenue.</li>
  <li><strong>Top 4 genres account for majority of sales</strong>: Rock, Latin, Metal, and Alternative &amp; Punk collectively generate $1,711.71 in revenue, suggesting focused promotional investment in these categories will yield high returns.</li>
  <li><strong>Video content (TV Shows, Drama) shows high per-unit value</strong> despite lower volume—TV Shows averaged $1.99 per unit versus Rock's $0.99, indicating potential for premium pricing or targeted promotion of niche content.</li>
  <li><strong>Long tail of underperforming genres</strong>: 11 genres generated under $20 in revenue each, including Opera with no sales, warranting review of catalog relevance and potential discontinuation.</li>
  <li><strong>Volume-to-revenue correlation is strong but not absolute</strong>—most genres show similar units and revenue ratios, except video content which commands higher per-unit pricing.</li>
</ul></div></div>
				</template>

			</div>

<div class="card h-100"><div class="card-body"><div><h6 class="card-title fw-semibold mb-1">Artist &amp; Album Contribution to Sales</h6><div class="text-muted small">Identification of top artists and their albums by revenue and track performance to prioritize catalog expansion and marketing focus</div></div><ul>
  <li><strong>Iron Maiden dominates revenue:</strong> Leading with $138.60 in total revenue across 21 albums and 140 tracks sold, significantly ahead of second-place U2 ($105.93). Iron Maiden's catalog depth appears to be a key revenue driver.</li>
  <li><strong>Revenue-per-track varies significantly:</strong> Lost generates $1.99 per track sold (41 tracks, $81.59 revenue), while Iron Maiden averages $0.99 per track. This suggests niche or high-priced content can outperform volume-heavy catalogs.</li>
  <li><strong>Catalog size does not guarantee revenue:</strong> Led Zeppelin (14 albums, $86.13) and Deep Purple (11 albums, $43.56) have large catalogs but underperform compared to U2 (10 albums, $105.93), indicating content quality and demand matter more than inventory quantity.</li>
  <li><strong>Top 5 artists account for substantial revenue:</strong> Iron Maiden, U2, Metallica, Led Zeppelin, and Lost combined generate $502.25, representing a concentrated revenue base worthy of promotional focus and expanded catalog investment.</li>
</ul></div></div>

<div class="card h-100"><div class="card-body"><h5 class="mb-2">How to Use This Catalog Performance Analysis</h5><p class="text-muted mb-0">This dashboard helps you evaluate how your catalog is performing and how promotion decisions affect results. Use each section to answer a specific question: what content is resonating, where performance is slipping, and which promotional actions are likely driving the changes you see.</p><div class="mt-3"><h6 class="fw-semibold mb-1">How to interpret the metrics</h6><ul class="mb-0 text-muted"><li><strong>Reach / exposure signals</strong>: These indicate how often your catalog items are being seen. If reach is high but outcomes are low, the issue is likely messaging, relevance, or conversion.</li><li><strong>Engagement signals</strong>: These show whether viewers are interacting. Falling engagement with stable reach often points to creative fatigue or mismatch with audience intent.</li><li><strong>Conversion signals</strong>: These reflect how effectively interest turns into the actions that matter (for example, purchases, subscriptions, or other catalog outcomes your dashboard tracks). If conversion is down, examine pricing, availability, placement, and audience fit.</li><li><strong>Promotion efficiency</strong>: Compare what changes after promotion to what would have happened otherwise (baseline vs. promoted periods). Look for both directional improvement and consistency, not just one-day spikes.</li></ul></div><div class="mt-3"><h6 class="fw-semibold mb-1">Suggested workflow for content decisions</h6><ol class="mb-0 text-muted"><li>Start with the overview sections to identify top performers and underperformers.</li><li>Drill into content-level breakdowns to pinpoint whether the bottleneck is exposure, engagement, or conversion.</li><li>Use promotion-focused views to validate which actions improve outcomes and which likely waste spend or attention.</li><li>Re-check after changes to confirm that improvements persist over time.</li></ol></div></div></div>
				</template>

document.addEventListener('DOMContentLoaded', () => {
	for (const template of document.querySelectorAll('template[data-dashboard-element-template]')) {
		const target = document.getElementById(template.dataset.dashboardElementTemplate);
		if (target) {
			target.replaceChildren(template.content.cloneNode(true));
		}
	}

	const getData = (key) => window.dashboardData?.[key] ?? [];
	const firstRow = (key) => {
		const rows = getData(key);
		return Array.isArray(rows) ? rows[0] : rows;
	};
	const formatNumber = (value, maximumFractionDigits = 0) => {
		const number = Number(value);
		return Number.isFinite(number) ? new Intl.NumberFormat(undefined, { maximumFractionDigits }).format(number) : '-';
	};
	const formatCurrency = (value, currency = 'USD') => {
		const number = Number(value);
		return Number.isFinite(number) ? new Intl.NumberFormat(undefined, { style: 'currency', currency }).format(number) : '-';
	};
	const formatPercent = (value, maximumFractionDigits = 1) => {
		const number = Number(value);
		return Number.isFinite(number) ? formatNumber(number, maximumFractionDigits) + '%' : '-';
	};
	const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, char => ({
		'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
	}[char]));
	const elementScripts = [




		{
			id: "kpi-kpi-top-genre",
			script: "const row = firstRow('kpi-kpi-top-genre');\nconst labelEl = document.getElementById('kpi-kpi-top-genre-label');\nconst valueEl = document.getElementById('kpi-kpi-top-genre-value');\nif (row) {\n  labelEl.textContent = row.genre_name !== undefined && row.genre_name !== null ? escapeHtml(String(row.genre_name)) : '';\n  valueEl.textContent = row.total_revenue !== undefined && row.total_revenue !== null ? formatCurrency(row.total_revenue) : '';\n}",
		},



		{
			id: "kpi-kpi-top-artist",
			script: "const row = firstRow(\"kpi-kpi-top-artist\");\nconst valueEl = document.getElementById(\"kpi-kpi-top-artist-value\");\nconst labelEl = document.getElementById(\"kpi-kpi-top-artist-label\");\nif (row) {\n  const artistName = row.artist_name ?? \"\";\n  const totalRevenue = row.total_revenue;\n  if (valueEl) valueEl.textContent = formatCurrency(totalRevenue);\n  if (labelEl) labelEl.textContent = artistName;\n}",
		},



		{
			id: "kpi-kpi-top-album",
			script: "const row = firstRow(\"kpi-kpi-top-album\");\nconst valueEl = document.getElementById(\"kpi-kpi-top-album-value\");\nconst labelEl = document.getElementById(\"kpi-kpi-top-album-label\");\n\nif (row) {\n  const title = row.album_title != null ? String(row.album_title) : \"\";\n  const revenue = row.total_revenue != null ? Number(row.total_revenue) : null;\n\n  labelEl.textContent = title ? title : \"—\";\n  valueEl.textContent = revenue == null || Number.isNaN(revenue) ? \"—\" : formatCurrency(revenue);\n}",
		},



		{
			id: "kpi-kpi-top-track",
			script: "const row = firstRow('kpi-kpi-top-track');\nif (row) {\n  const labelEl = document.getElementById('kpi-kpi-top-track-label');\n  const valueEl = document.getElementById('kpi-kpi-top-track-value');\n\n  const track = row.track_name ?? '';\n  const artist = row.artist_name ?? '';\n  const totalRevenue = row.total_revenue;\n\n  labelEl.textContent = [track, artist].filter(Boolean).join(' — ');\n  valueEl.textContent = formatCurrency(totalRevenue);\n}",
		},



		{
			id: "chart-chart-revenue-by-genre",
			script: "const data = getData('chart-chart-revenue-by-genre');\nconst rows = Array.isArray(data) ? data : [];\nconst top = rows.slice(0, 12);\nconst labels = top.map(r => r.Genre);\nconst values = top.map(r => r.TotalRevenue);\nconst canvas = document.getElementById('chart-chart-revenue-by-genre-canvas');\nconst ctx = canvas.getContext('2d');\nconst chart = new Chart(ctx, {\n  type: 'bar',\n  data: {\n    labels: labels,\n    datasets: [\n      {\n        label: 'TotalRevenue',\n        data: values,\n        backgroundColor: 'rgba(13, 110, 253, 0.65)',\n        borderColor: 'rgba(13, 110, 253, 1)',\n        borderWidth: 1\n        \n      }\n    ]\n  },\n  options: {\n    responsive: true,\n    maintainAspectRatio: false,\n    indexAxis: 'y',\n    plugins: {\n      legend: {\n        display: false\n      },\n      tooltip: {\n        callbacks: {\n          label: function(context) {\n            const v = context.parsed.x;\n            return ' ' + formatCurrency(v);\n          }\n        }\n      }\n    },\n    scales: {\n      y: {\n        ticks: {\n          autoSkip: false\n        },\n        grid: {\n          display: false\n        }\n      },\n      x: {\n        beginAtZero: true,\n        ticks: {\n          callback: function(value) {\n            return formatNumber(value, 0);\n          }\n        }\n      }\n    }\n  }\n});",
		},



		{
			id: "chart-chart-track-sales-by-artist",
			script: "const data = getData('chart-chart-track-sales-by-artist');\nconst rows = Array.isArray(data) ? data.slice(0, 12) : [];\nconst labels = rows.map(r => escapeHtml(r.artist_name ?? ''));\nconst values = rows.map(r => Number(r.total_tracks_sold ?? 0));\n\nconst canvas = document.getElementById('chart-chart-track-sales-by-artist-canvas');\nconst ctx = canvas.getContext('2d');\n\nnew Chart(ctx, {\n  type: 'bar',\n  data: {\n    labels,\n    datasets: [\n      {\n        label: 'Tracks sold',\n        data: values,\n        borderWidth: 0,\n        backgroundColor: 'rgba(54, 162, 235, 0.7)'\n      }\n    ]\n  },\n  options: {\n    responsive: true,\n    maintainAspectRatio: false,\n    indexAxis: 'y',\n    plugins: {\n      legend: {\n        display: false\n      },\n      tooltip: {\n        callbacks: {\n          label: function(context) {\n            const v = context.parsed.x;\n            return ' ' + formatNumber(v, 0) + ' tracks';\n          }\n        }\n      }\n    },\n    scales: {\n      x: {\n        beginAtZero: true,\n        ticks: {\n          callback: function(value) {\n            return formatNumber(value, 0);\n          }\n        }\n      },\n      y: {\n        ticks: {\n          autoSkip: false\n        }\n      }\n    }\n  }\n});",
		},



		{
			id: "chart-chart-album-performance-trend",
			script: "const elId = \"chart-chart-album-performance-trend\";\nconst canvas = document.getElementById(elId + \"-canvas\");\nconst data = getData(elId);\nconst rows = Array.isArray(data) ? data : [];\nconst sliced = rows.slice(0, 12);\nconst labels = sliced.map(r => `${escapeHtml(r.album_title)} — ${escapeHtml(r.artist_name)}`);\nconst points = sliced.map(r => ({ x: Number(r.tracks_sold), y: Number(r.total_revenue) }));\n\nif (points.length >= 1) {\n  const ctx = canvas.getContext(\"2d\");\n  const chartData = {\n    datasets: [\n      {\n        label: \"Albums\",\n        data: points,\n        backgroundColor: \"rgba(13, 110, 253, 0.35)\",\n        borderColor: \"rgba(13, 110, 253, 1)\",\n        pointRadius: 5,\n        pointHoverRadius: 7,\n        showLine: false\n      }\n    ]\n  };\n\n  const chart = new Chart(ctx, {\n    type: \"scatter\",\n    data: chartData,\n    options: {\n      responsive: true,\n      maintainAspectRatio: false,\n      plugins: {\n        legend: { display: false },\n        tooltip: {\n          callbacks: {\n            label: (context) => {\n              const idx = context.dataIndex;\n              const row = sliced[idx] || {};\n              const title = row.album_title != null ? row.album_title : \"\";\n              const artist = row.artist_name != null ? row.artist_name : \"\";\n              const tracks = row.tracks_sold != null ? formatNumber(row.tracks_sold, 0) : \"0\";\n              const revenue = row.total_revenue != null ? formatCurrency(row.total_revenue) : formatCurrency(0);\n              return `${title} (${artist}) — Tracks: ${tracks}, Revenue: ${revenue}`;\n            }\n          }\n        }\n      },\n      scales: {\n        x: {\n          title: { display: true, text: \"Tracks Sold\" },\n          ticks: { precision: 0 }\n        },\n        y: {\n          title: { display: true, text: \"Total Revenue\" },\n          ticks: {\n            callback: (value) => formatCurrency(value)\n          }\n        }\n      }\n    }\n  });\n}",
		},



		{
			id: "table-table-genre-performance-metrics",
			script: "const container = document.getElementById('table-table-genre-performance-metrics-table-body');\nconst data = getData('table-table-genre-performance-metrics') || [];\ncontainer.innerHTML = '';\n\nif (data.length === 0) {\n  const tr = document.createElement('tr');\n  const td = document.createElement('td');\n  td.colSpan = 6;\n  td.className = 'text-center text-muted py-3';\n  td.textContent = 'No data available.';\n  tr.appendChild(td);\n  container.appendChild(tr);\n} else {\n  for (const row of data) {\n    const tr = document.createElement('tr');\n\n    const tdGenre = document.createElement('td');\n    tdGenre.textContent = row.Genre;\n    tr.appendChild(tdGenre);\n\n    const tdRevenue = document.createElement('td');\n    tdRevenue.className = 'text-end';\n    tdRevenue.textContent = formatCurrency(row.TotalRevenue);\n    tr.appendChild(tdRevenue);\n\n    const tdArtists = document.createElement('td');\n    tdArtists.className = 'text-end';\n    tdArtists.textContent = formatNumber(row.UniqueArtistCount, 0);\n    tr.appendChild(tdArtists);\n\n    const tdAlbums = document.createElement('td');\n    tdAlbums.className = 'text-end';\n    tdAlbums.textContent = formatNumber(row.UniqueAlbumCount, 0);\n    tr.appendChild(tdAlbums);\n\n    const tdTracks = document.createElement('td');\n    tdTracks.className = 'text-end';\n    tdTracks.textContent = formatNumber(row.TracksSold, 0);\n    tr.appendChild(tdTracks);\n\n    const tdAvgPrice = document.createElement('td');\n    tdAvgPrice.className = 'text-end';\n    tdAvgPrice.textContent = formatCurrency(row.AvgTrackUnitPrice);\n    tr.appendChild(tdAvgPrice);\n\n    container.appendChild(tr);\n  }\n}",
		},



		{
			id: "table-table-top-performing-albums",
			script: "const data = getData('table-table-top-performing-albums');\nconst tbody = document.getElementById('table-table-top-performing-albums-table-body');\nconst meta = document.getElementById('table-table-top-performing-albums-meta');\n\nconst rows = Array.isArray(data) ? data : [];\nconst topRows = rows.slice(0, 30);\n\ntbody.innerHTML = '';\n\nfor (let i = 0; i < topRows.length; i++) {\n  const r = topRows[i] || {};\n  const albumTitle = r.album_title ?? '';\n  const artistName = r.artist_name ?? '';\n  const genre = r.genre ?? '';\n  const trackCount = r.track_count;\n  const totalUnitsSold = r.total_units_sold;\n  const totalRevenue = r.total_revenue;\n\n  const tr = document.createElement('tr');\n\n  const tdRank = document.createElement('td');\n  tdRank.className = 'text-muted';\n  tdRank.textContent = String(i + 1);\n  tr.appendChild(tdRank);\n\n  const tdAlbum = document.createElement('td');\n  tdAlbum.innerHTML = escapeHtml(albumTitle);\n  tr.appendChild(tdAlbum);\n\n  const tdArtist = document.createElement('td');\n  tdArtist.innerHTML = escapeHtml(artistName);\n  tr.appendChild(tdArtist);\n\n  const tdGenre = document.createElement('td');\n  tdGenre.innerHTML = escapeHtml(genre);\n  tr.appendChild(tdGenre);\n\n  const tdTracks = document.createElement('td');\n  tdTracks.className = 'text-end';\n  tdTracks.textContent = trackCount == null || Number.isNaN(Number(trackCount)) ? '' : formatNumber(Number(trackCount), 0);\n  tr.appendChild(tdTracks);\n\n  const tdUnits = document.createElement('td');\n  tdUnits.className = 'text-end';\n  tdUnits.textContent = totalUnitsSold == null || Number.isNaN(Number(totalUnitsSold)) ? '' : formatNumber(Number(totalUnitsSold), 0);\n  tr.appendChild(tdUnits);\n\n  const tdRevenue = document.createElement('td');\n  tdRevenue.className = 'text-end';\n  tdRevenue.textContent = totalRevenue == null || Number.isNaN(Number(totalRevenue)) ? '' : formatCurrency(Number(totalRevenue));\n  tr.appendChild(tdRevenue);\n\n  tbody.appendChild(tr);\n}\n\nmeta.textContent = `Showing top ${topRows.length} albums ranked by revenue.`;",
		},








	];
	for (const elementScript of elementScripts) {
		try {
			new Function(
				'getData',
				'firstRow',
				'formatNumber',
				'formatCurrency',
				'formatPercent',
				'escapeHtml',
				elementScript.script
			)(getData, firstRow, formatNumber, formatCurrency, formatPercent, escapeHtml);
		} catch (error) {
			console.error('Dashboard element failed:', elementScript.id, error);
		}
	}
});
