			display: flex;
			align-items: stretch;

		}

			flex: 1 1 auto;
			min-width: 0;
			width: 100%;
			height: 100%;

			flex-direction: column;
		}
		.dashboard-element-table .table-responsive {
			max-height: 360px;
			overflow: auto;
		}
		.dashboard-element-metric .metric-value-number {
			display: block;
			margin-top: 0.75rem;
			font-size: 2.5rem !important;
			font-weight: 700 !important;
			line-height: 1.1;
		}
		.dashboard-element-header + .dashboard-element-metric .metric-value-number {
			font-size: 3rem !important;
		}
		.dashboard-element-metric [id$="-label"] {
			margin-top: 0.25rem;
			color: var(--bs-secondary-color);
			font-size: 0.875rem;
		}
	</style>
</head>

<div class="mb-4"><h1 class="h3 mb-2">Baseball Team Performance Across Eras</h1><div class="text-muted">Use this dashboard to compare how team wins, scoring, pitching, and standout seasons evolved over time.</div></div>

				</template>

				</template>

				</template>

			</div>

			<div id="insight-era-shifts" class="col-12 col-md-6 dashboard-element dashboard-element-insight">

				<template data-dashboard-element-template="insight-era-shifts">
<div class="card h-100"><div class="card-body"><h6 class="card-title fw-semibold mb-2">Era shifts in team performance</h6><div class="text-muted small mb-3">Compare team-level wins, runs scored, runs allowed, and run differential across broad historical eras to identify how performance profiles changed over time.</div><ul class="mb-0"><li><strong>Wins rose after the dead-ball era.</strong> Average team wins jump from about <strong>53.3</strong> in <strong>1871-1900</strong> to the mid-to-high <strong>70s</strong> in every later era, peaking at about <strong>80.6</strong> in <strong>1961-1980</strong>.</li><li><strong>Scoring shifted by era, but not monotonically.</strong> Average runs scored were highest in <strong>1921-1940</strong> at about <strong>752.5</strong>, then dropped in <strong>1941-1960</strong> and <strong>1961-1980</strong>, before rising again in <strong>1981-2000</strong> and <strong>2001-2022</strong> to roughly <strong>708-713</strong>.</li><li><strong>Runs allowed closely matched runs scored in every era shown.</strong> The averages are essentially identical within each era, which means the excerpt does <strong>not</strong> show a broad era-level scoring edge from offense over pitching or vice versa.</li><li><strong>Run differential is flat in the aggregates.</strong> The reported average run differential is <strong>0 or near 0</strong> across all eras, so this excerpt suggests league-wide balance rather than a dominant scoring environment at the era level.</li><li><strong>Best overall win profile appears in the modern-mid era.</strong> Of the eras shown, <strong>1961-1980</strong> combines the highest average wins with relatively modest runs scored/allowed, while <strong>2001-2022</strong> shows slightly lower wins but higher scoring than the late 20th century.</li></ul></div></div>
				</template>

			</div>

			<div id="insight-standout-seasons" class="col-12 col-md-6 dashboard-element dashboard-element-insight">

				<template data-dashboard-element-template="insight-standout-seasons">
<div class="card h-100"><div class="card-body"><h6 class="card-title fw-semibold mb-1">Standout team seasons</h6><div class="text-muted small mb-3">Surface the most exceptional single-season team performances by wins and run differential so users can spot peak seasons while exploring era changes.</div><ul><li><strong>Best record in the excerpt:</strong> the 1906 Chicago Cubs went 116-36, the most wins shown, with a strong +323 run differential.</li><li><strong>Modern-era contender:</strong> the 2001 Seattle Mariners also won 116 games, scoring 927 runs and allowing 627, for a +300 differential.</li><li><strong>Largest run differential:</strong> the 1927 New York Yankees stand out with +376, even though they had one fewer win than the top two seasons.</li><li><strong>Other elite seasons span multiple eras:</strong> the 1998 Yankees, 2022 Dodgers, 1954 Cleveland, 1909 Pirates, and 1969 Orioles all reached at least 109 wins.</li><li><strong>Scoring vs. prevention:</strong> the biggest seasons combine high run totals with strong pitching/defense, but the balance varies—some teams won through dominant scoring (1927 NYA: 975 runs scored), while others paired solid scoring with excellent run suppression (2022 LAN: 847 scored, 513 allowed).</li></ul></div></div>
				</template>

			</div>
