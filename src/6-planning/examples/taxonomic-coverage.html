<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<title>Taxonomic Coverage Overview</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5/dist/css/bootstrap.min.css" rel="stylesheet" />
	<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
	<style>
		.dashboard-container {
			max-width: 1480px;
		}
		.dashboard-element, .dashboard-element > .card, .dashboard-element .card-body {
			min-width: 0;
		}
		.dashboard-element {
			display: flex;
			align-items: stretch;
			flex-direction: column;
		}
		.dashboard-element > * {
			flex: 1 1 auto;
			min-width: 0;
			width: 100%;
			height: 100%;
		}
		.dashboard-element .card > :not(.card-body) {
			margin: 0 var(--bs-card-spacer-x) var(--bs-card-spacer-y);
		}
		.dashboard-element-table .card-body {
			display: flex;
			flex-direction: column;
		}
		.dashboard-element-table .table-responsive {
			max-height: 360px;
			overflow: auto;
		}
		.dashboard-element-metric .metric-value-number {
			display: block;
			margin-top: 0.75rem;
			font-size: 2.5rem !important;
			font-weight: 700 !important;
			line-height: 1.1;
		}
		.dashboard-element-header + .dashboard-element-metric .metric-value-number {
			font-size: 3rem !important;
		}
		.dashboard-element-metric [id$="-label"] {
			margin-top: 0.25rem;
			color: var(--bs-secondary-color);
			font-size: 0.875rem;
		}
	</style>
</head>

<body>
	<div class="container dashboard-container my-4">
		<div class="row g-3">

			<div id="header-dashboard-header" class="col-12 dashboard-element dashboard-element-header">

				<template data-dashboard-element-template="header-dashboard-header">
<header class="mb-4"><h1 class="h3 fw-bold mb-2">Taxonomic Coverage Overview</h1><p class="text-muted mb-0">Use this dashboard to explore how ITIS records are distributed across kingdoms, ranks, major groups, and hierarchy depth.</p></header>
				</template>

			</div>

			<div id="metric-kingdom-count" class="col-12 col-md-6 dashboard-element dashboard-element-metric">

				<template data-dashboard-element-template="metric-kingdom-count">
<div class="card h-100"><div class="card-body"><h6 class="card-title fw-semibold mb-1">Kingdoms Represented</h6><div class="text-muted small mb-2">Number of distinct kingdoms in the taxonomy dataset.</div><div class="metric-value-number" id="metric-kingdom-count-value"></div></div></div>
				</template>

			</div>

			<div id="metric-taxon-count" class="col-12 col-md-6 dashboard-element dashboard-element-metric">

				<template data-dashboard-element-template="metric-taxon-count">
<div class="card h-100"><div class="card-body"><h6 class="card-title fw-semibold mb-1">Taxonomic Units</h6><div class="text-muted small mb-2">Total number of taxonomic units available for coverage analysis.</div><div id="metric-taxon-count-value" class="metric-value-number">—</div></div></div>
				</template>

			</div>

			<div id="metric-rank-count" class="col-12 col-md-6 dashboard-element dashboard-element-metric">

				<template data-dashboard-element-template="metric-rank-count">
<div class="card h-100"><div class="card-body"><h6 class="card-title fw-semibold mb-1">Ranks Represented</h6><div class="text-muted small">Number of distinct taxonomic ranks present in the taxonomy records.</div><div id="metric-rank-count-value" class="metric-value-number">—</div></div></div>
				</template>

			</div>

			<div id="metric-deepest-level" class="col-12 col-md-6 dashboard-element dashboard-element-metric">

				<template data-dashboard-element-template="metric-deepest-level">
<div class="card h-100"><div class="card-body"><h6 class="card-title fw-semibold mb-1">Deepest Hierarchy Level</h6><div class="text-muted small mb-2">Highest hierarchy level recorded in the taxonomy structure.</div><div id="metric-deepest-level-value" class="metric-value-number">—</div></div></div>
				</template>

			</div>

			<div id="chart-kingdom-overview" class="col-12 dashboard-element dashboard-element-chart">

				<template data-dashboard-element-template="chart-kingdom-overview">
<div class="card h-100"><div class="card-body"><h6 class="card-title fw-semibold mb-1">Coverage by Kingdom</h6><div class="text-muted small mb-3">Ranked comparison of how many taxonomic units are represented in each kingdom, to show which major branches dominate the dataset.</div><div style="position: relative; height: 380px; width: 100%;"><canvas id="chart-kingdom-overview-canvas" aria-label="Coverage by Kingdom"></canvas></div></div></div>
				</template>

			</div>

			<div id="chart-rank-spectrum" class="col-12 col-md-6 dashboard-element dashboard-element-chart">

				<template data-dashboard-element-template="chart-rank-spectrum">
<div class="card h-100"><div class="card-body"><h6 class="card-title fw-semibold mb-1">Coverage by Rank</h6><div class="text-muted small mb-3">Distribution of taxonomic units across taxonomic ranks, showing the breadth of representation from higher to lower ranks.</div><div style="position: relative; height: 360px; width: 100%;"><canvas id="chart-rank-spectrum-canvas"></canvas></div></div></div>
				</template>

			</div>

			<div id="chart-depth-profile" class="col-12 col-md-6 dashboard-element dashboard-element-chart">

				<template data-dashboard-element-template="chart-depth-profile">
<div class="card h-100"><div class="card-body"><h6 class="card-title fw-semibold mb-1">Hierarchy Depth Profile</h6><div class="text-muted small mb-3">Counts of taxonomic units by hierarchy level to reveal how deep the taxonomy tree goes and where most records sit.</div><div style="position: relative; height: 420px; width: 100%;"><canvas id="chart-depth-profile-canvas" style="width: 100%; height: 100%;"></canvas></div></div></div>
				</template>

			</div>

			<div id="table-group-breakdown" class="col-12 col-md-6 dashboard-element dashboard-element-table">

				<template data-dashboard-element-template="table-group-breakdown">
<div class="card h-100"><div class="card-body"><h6 class="card-title fw-semibold mb-1">Major Group Breakdown</h6><div class="text-muted small mb-3">A compact comparison of kingdoms, ranks, and record counts to help inspect which organism groups are present and how they are distributed.</div><div class="table-responsive"><table class="table table-sm align-middle mb-0"><thead><tr><th scope="col">Kingdom</th><th scope="col">Rank</th><th scope="col" class="text-end">Taxon Count</th></tr></thead><tbody id="table-group-breakdown-table-body"></tbody></table></div></div></div>
				</template>

			</div>

			<div id="table-deep-taxa" class="col-12 col-md-6 dashboard-element dashboard-element-table">

				<template data-dashboard-element-template="table-deep-taxa">
<div class="card h-100"><div class="card-body"><div class="d-flex align-items-start justify-content-between gap-3"><div><h6 class="card-title fw-semibold mb-1">Deepest Represented Taxa</h6><div class="text-muted small">A ranked list of taxa with the greatest hierarchy depth, useful for spotting the most deeply nested organism lineages represented in the database.</div></div></div><div class="table-responsive mt-3"><table class="table table-sm align-middle" aria-label="Deepest represented taxa"><thead><tr><th scope="col">TSN</th><th scope="col">Taxon</th><th scope="col">Kingdom</th><th scope="col">Rank</th><th scope="col">Depth level</th></tr></thead><tbody id="table-deep-taxa-table-body"></tbody></table></div></div></div>
				</template>

			</div>

			<div id="insight-kingdom-cov" class="col-12 col-md-6 dashboard-element dashboard-element-insight">

				<template data-dashboard-element-template="insight-kingdom-cov">
<div class="card h-100"><div class="card-body"><ul>
  <li><strong>Animalia</strong> dominates coverage with <strong>784,692</strong> taxonomic units, far ahead of all other kingdoms.</li>
  <li><strong>Plantae</strong> is the next largest group at <strong>168,097</strong>, but it is still well below Animalia.</li>
  <li>Coverage drops sharply after the top two: <strong>Bacteria</strong> has <strong>21,602</strong> units, followed by <strong>Chromista</strong> (<strong>9,370</strong>) and <strong>Fungi</strong> (<strong>5,141</strong>).</li>
  <li><strong>Protozoa</strong> (<strong>3,646</strong>) and <strong>Archaea</strong> (<strong>619</strong>) are represented much less extensively in this excerpt.</li>
  <li>For every kingdom shown, <strong>total records equal distinct TSNs</strong>, suggesting no duplicate TSN inflation in these counts.</li>
</ul></div></div>
				</template>

			</div>

			<div id="insight-rank-depth" class="col-12 col-md-6 dashboard-element dashboard-element-insight">

				<template data-dashboard-element-template="insight-rank-depth">
<div class="card h-100"><div class="card-body"><h6 class="card-title fw-semibold mb-1">Rank and hierarchy depth</h6><div class="text-muted small mb-3">Highlights how representation is distributed across taxonomic ranks and hierarchy levels to reveal the structure of the dataset.</div><ul>
  <li><strong>Species</strong> dominate the visible results at nearly every listed hierarchy level, with the largest counts at levels <strong>18</strong> (73,834), <strong>11</strong> (70,552), <strong>10</strong> (61,567), and <strong>16</strong> (59,883).</li>
  <li><strong>Genus</strong> is the next most represented rank in the excerpt, but at much lower volumes than species; its highest visible count is <strong>9,888</strong> at level <strong>10</strong>.</li>
  <li><strong>Subspecies</strong> appears meaningfully but less often than species and genus, led by level <strong>12</strong> with <strong>21,759</strong> records and level <strong>19</strong> with <strong>7,812</strong>.</li>
  <li>A few other ranks are present in smaller amounts, such as <strong>Variety</strong> at level <strong>12</strong> with <strong>5,910</strong> records, suggesting the dataset includes more granular taxonomic categories beyond the main ranks.</li>
  <li>The visible rows suggest representation is concentrated in deeper hierarchy levels, especially around levels <strong>10–19</strong>, but the excerpt is partial so the full distribution across all ranks and levels may differ.</li>
</ul></div></div>
				</template>

			</div>

				</template>

			</div>

		</div>
	</div>
