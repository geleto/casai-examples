<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<title>{{ title | escape }}</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5/dist/css/bootstrap.min.css" rel="stylesheet" />
	<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
	<style>
		.dashboard-element, .dashboard-element > .card, .dashboard-element .card-body {
			min-width: 0;
		}
		.dashboard-element {
			display: flex;
			align-items: stretch;
			flex-direction: column;
		}
		.dashboard-element > * {
			flex: 1 1 auto;
			min-width: 0;
			width: 100%;
			height: 100%;
		}
		.dashboard-element-kpi .kpi-value-number {
			display: block;
			margin-top: 0.75rem;
			font-size: 2.5rem !important;
			font-weight: 700 !important;
			line-height: 1.1;
		}
		.dashboard-element-header + .dashboard-element-kpi .kpi-value-number {
			font-size: 3rem !important;
		}
		.dashboard-element-kpi [id$="-label"] {
			margin-top: 0.25rem;
			color: var(--bs-secondary-color);
			font-size: 0.875rem;
		}
	</style>
</head>

<body>
	<div class="container my-4">
		<div class="row g-3">
{% for element in elements %}
			<div id="{{ element.id | escape }}" class="{{ element.columnClass }} dashboard-element dashboard-element-{{ element.type | escape }}"></div>
{% endfor %}
		</div>
	</div>

	<script>
window.dashboardData = {{ dataJson | safe }};

document.addEventListener('DOMContentLoaded', () => {
	const getData = (key) => window.dashboardData?.[key] ?? [];
	const firstRow = (key) => {
		const rows = getData(key);
		return Array.isArray(rows) ? rows[0] : rows;
	};
	const formatNumber = (value, maximumFractionDigits = 0) => {
		const number = Number(value);
		return Number.isFinite(number) ? new Intl.NumberFormat(undefined, { maximumFractionDigits }).format(number) : '-';
	};
	const formatCurrency = (value, currency = 'USD') => {
		const number = Number(value);
		return Number.isFinite(number) ? new Intl.NumberFormat(undefined, { style: 'currency', currency }).format(number) : '-';
	};
	const formatPercent = (value, maximumFractionDigits = 1) => {
		const number = Number(value);
		return Number.isFinite(number) ? formatNumber(number, maximumFractionDigits) + '%' : '-';
	};
	const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, char => ({
		'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
	}[char]));
{% for element in elements %}
	{
		const target = document.getElementById({{ element.idJson | safe }});
		if (target) target.innerHTML = {{ element.htmlJson | safe }};
	}
{% endfor %}
{% for element in elements %}
{% if element.script %}
	try {
		(() => {
{{ element.script | safe }}
		})();
	} catch (error) {
		console.error('Dashboard element failed:', {{ element.idJson | safe }}, error);
	}
{% endif %}
{% endfor %}
});
	</script>
</body>

</html>
