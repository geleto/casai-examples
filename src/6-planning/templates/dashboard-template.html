<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<title>{{ title | escape }}</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5/dist/css/bootstrap.min.css" rel="stylesheet" />
	<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
</head>

<body>
	<div class="container my-4">
		<div class="row g-3">
{% for element in elements %}
			<div class="{{ element.columnClass }}">
{{ element.html | safe }}
			</div>
{% endfor %}
		</div>
	</div>

	<script>
window.dashboardData = {{ dataJson | safe }};

document.addEventListener('DOMContentLoaded', () => {
	const getData = (key) => window.dashboardData?.[key] ?? [];
	const firstRow = (key) => {
		const rows = getData(key);
		return Array.isArray(rows) ? rows[0] : rows;
	};
	const formatNumber = (value, maximumFractionDigits = 0) => {
		const number = Number(value);
		return Number.isFinite(number) ? new Intl.NumberFormat(undefined, { maximumFractionDigits }).format(number) : '-';
	};
	const formatCurrency = (value, currency = 'USD') => {
		const number = Number(value);
		return Number.isFinite(number) ? new Intl.NumberFormat(undefined, { style: 'currency', currency }).format(number) : '-';
	};
	const formatPercent = (value, maximumFractionDigits = 1) => {
		const number = Number(value);
		return Number.isFinite(number) ? formatNumber(number, maximumFractionDigits) + '%' : '-';
	};
	const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, char => ({
		'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
	}[char]));
{% for element in elements %}
{% if element.script %}
	try {
		(() => {
{{ element.script | safe }}
		})();
	} catch (error) {
		console.error('Dashboard element failed:', {{ element.idJson | safe }}, error);
	}
{% endif %}
{% endfor %}
});
	</script>
</body>

</html>
